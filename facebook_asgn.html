<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook.com</title>
    <style>
        
       input{
        height: 70px;
        width: 600px;
        border-radius: 15px;
        border: 1px solid;
        padding-left: 10px;
       }
       #login{
        width: 610px;
        height: 50px;
        border-radius: 30px;
        border: 1px;
        background-color: #1877F2;
        color: white;
       }
       #forgot{
        width: 610px;
        height: 50px;
        border-radius: 30px;
        border: 1px ;
        background-color: white;
       }
       #forgot:hover{
        background-color: #EEEEEE;
       }
       input::placeholder{
        font-weight: bold;
        font-size: 15px;
       }
       #newacc{
        width: 610px;
        height: 50px;
        border-radius: 30px;
        border: 1px solid #1877F2;
        background-color: white;
        color: #1877F2;
       }
       form{
        padding-left: 160px;

       }
       h2{
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        font-weight: 400;
       }
       img{
        width: 500px;
        height: 500px;
        margin-top: 100px;
        padding-left: 150px;
       }
       div{
        border: 2px solid gray;
        display: flex;
       }
    </style>
</head>
<body>
    <div>
        <img src="./Screenshot 2026-08-30 115056.png" alt="">
    <form>
        <br><br><br><br><br><br>
        <label><b>Log in to Facebook</b></label>
        <br><br>
        <input type="text" placeholder="Email or Phone number" required>
        <br><br><br>
        
        <input type="password" placeholder="Password">
        <br><br>
        <button type="submit" id="login"><b>Log in</b></button>
        <br><br>
        <button type="submit" id="forgot"><b>Forgot your Password?</b></button>
        <br><br><br><br><br>
        <button type="submit" id="newacc"><b>Create New Account</b></button>
        <h2><b>Meta</b></h2>
    </form>
    </div>
</body>
</html>
