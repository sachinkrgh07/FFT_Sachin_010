<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RWD</title>
    <style>
    h1{
        background-color: brown;
    }
    p{
        background-color: pink;
    }
    @media(max-width:600px){
        h1{
            background-color: aqua;
            text-align: center;

        }
        p{
            font-size: 16px;
            text-align: justify;


        }
        div{
            display: flex;


        }

    }
    img{
        filter: blur(10px);
        filter: brightness(50%);
        filter: contrast(80%);
    }

    </style>
</head>
<body>
